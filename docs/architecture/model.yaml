schema_version: 1
project:
  id: praxis-agent
  name: Praxis
  description: Native local-first CLI coding-agent runtime and its provider-neutral architecture.

modules:
  - id: cli-composition
    name: CLI composition
    responsibilities:
      - Dispatch CLI arguments and commands.
      - Compose workspace trust, providers, persistence, integrations, and services.
      - Own service lifecycle for an invocation.
    actions:
      - Resolve native runtime settings and data-plane paths.
      - Create default session dependencies and background-worker runtimes.
      - Handle version and help before provider initialization.
      - Load versioned local held-out corpora and validate qualification artifacts before provider runtime creation.
      - Configure default Project and Plugin Eval tool admission so catalog exposure and Bash call preapproval remain separate.
    evidence:
      - path: docs/ARCHITECTURE.md
        confidence: confirmed
      - path: src/cli.ts
        symbol: run
        confidence: confirmed
      - path: src/cli-runtime.ts
        symbol: createDefaultDependencies
        confidence: confirmed
      - path: src/cli-runtime.ts
        symbol: createDefaultService
        confidence: confirmed
      - path: src/evals/held-out-corpus.ts
        symbol: loadHeldOutCorpus
        confidence: confirmed
      - path: src/evals/held-out-qualification.ts
        symbol: executeHeldOutQualificationCommand
        confidence: confirmed
      - path: src/cli-runtime.ts
        symbol: defaultPluginEvalRuntimeFactory
        confidence: confirmed

  - id: tui-adapter
    name: TUI adapter
    responsibilities:
      - Adapt terminal interaction to provider-neutral runtime events.
      - Present conversation state and user decision surfaces.
      - Manage interactive terminal lifecycle.
    actions:
      - Submit prompts and observe session events through Ink.
      - Project RuntimeEvent state, streaming deltas, approvals, and decisions.
      - Start and resume interactive sessions.
    evidence:
      - path: src/cli/interactive.tsx
        symbol: InteractiveApp
        confidence: confirmed
      - path: src/cli/interactive.tsx
        symbol: runInteractive
        confidence: confirmed
      - path: docs/ARCHITECTURE.md
        confidence: confirmed

  - id: session-application
    name: Session application
    responsibilities:
      - Orchestrate resumable sessions and turn lifecycles.
      - Prepare context and persist provider-neutral events.
      - Account usage and settle shutdown outcomes.
    actions:
      - Register and coordinate one active turn per session.
      - Assemble bounded context and translate runtime events to native persistence.
      - Record persistence receipts, accounting, and terminal settlement.
    evidence:
      - path: src/application/session-service.ts
        symbol: ClaudeSessionService
        confidence: confirmed
      - path: src/application/turn-lifecycle.ts
        symbol: TurnCoordinator
        confidence: confirmed
      - path: src/application/context-preparation.ts
        symbol: ContextPreparation
        confidence: confirmed
      - path: src/application/turn-persistence.ts
        symbol: TurnPersistence
        confidence: confirmed
      - path: src/application/turn-accounting.ts
        symbol: TurnAccounting
        confidence: confirmed

  - id: core-runtime
    name: Core runtime
    responsibilities:
      - Define provider-neutral agent-loop contracts.
      - Coordinate model output, tool scheduling, permissions, and terminal outcomes.
    actions:
      - Stream model events through the ModelProvider port.
      - Validate and schedule registry tools.
      - Emit provider-neutral terminal and failure events.
    evidence:
      - path: src/core/runtime.ts
        symbol: ModelProvider
        confidence: confirmed
      - path: src/core/runtime.ts
        symbol: ToolRegistry
        confidence: confirmed
      - path: src/core/runtime.ts
        symbol: PermissionResolver
        confidence: confirmed
      - path: src/core/runtime.ts
        symbol: AgentRuntime
        confidence: confirmed
      - path: src/core/tool-execution-scheduler.ts
        symbol: ToolExecutionScheduler
        confidence: confirmed
      - path: src/core/transcript-event.ts
        symbol: TranscriptEvent
        confidence: confirmed

  - id: tool-security-runtime
    name: Tool security runtime
    responsibilities:
      - Expose local executable tool capabilities.
      - Apply scheduling, permission, sandbox, and process-admission policy.
    actions:
      - Register and resolve local tools.
      - Resolve allow, ask, or deny permission decisions.
      - Require static semantic and path safety inside eval-authorized roots before preapproving default-eval Bash calls.
      - Wrap admitted shell execution with sandbox and bounded process controls.
    evidence:
      - path: src/tools/local-tools.ts
        symbol: LocalToolRegistry
        confidence: confirmed
      - path: src/permissions/claude-permission-resolver.ts
        symbol: ClaudePermissionResolver
        confidence: confirmed
      - path: src/evals/eval-tool-admission.ts
        symbol: isEvalToolCallPreapproved
        confidence: confirmed
      - path: src/sandbox/claude-sandbox-runtime.ts
        symbol: ClaudeSandboxRuntime
        confidence: confirmed
      - path: src/platform/bounded-process-runner.ts
        symbol: BoundedProcessRunner
        confidence: confirmed

  - id: provider-gateway
    name: Provider gateway
    responsibilities:
      - Resolve provider targets, credentials, and declared capabilities.
      - Adapt provider protocols behind the ModelProvider port.
      - Seal turn routes and bound fallback attempts.
    actions:
      - Resolve the native provider registry and target configuration.
      - Adapt Anthropic Messages, OpenAI-compatible Chat, OpenAI Responses, and fallback routes.
      - Buffer eligible failures, enforce deadlines, and seal the successful route.
    evidence:
      - path: src/providers/provider-registry.ts
        symbol: resolveProviderRegistry
        confidence: confirmed
      - path: src/providers/provider-registry.ts
        symbol: NativeProviderRegistry
        confidence: confirmed
      - path: src/providers/fallback-provider.ts
