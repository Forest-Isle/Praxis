  - id: native-persistence
    name: Native persistence
    responsibilities:
      - Own the Praxis-native data-plane roots and paths.
      - Encode and append authoritative native Transcript events.
      - Store native settings, resources, and operational sidecars.
    actions:
      - Resolve the native root and session paths.
      - Acquire leases, validate tails, and append versioned JSONL records.
      - Read and write native settings, shared resources, and operational state.
