flows:
  - id: agent-turn
    name: Agent turn
    critical: true
    steps:
      - node: cli-composition
        action: Dispatch a prompt or resume command and compose native dependencies.
      - node: tui-adapter
        action: Submit the user turn and present runtime state and decisions.
      - node: session-application
        action: Register the turn, prepare context, and own one terminal settlement.
      - node: core-runtime
        action: Run provider-neutral model and tool rounds.
      - node: provider-gateway
        action: Stream the selected provider route and normalize accepted events.
      - node: model-provider-apis
        action: Return protocol output or an error; failures before accepted events bypass Transcript append.
      - node: native-persistence
        action: Conditionally persist accepted assistant and tool events before projection.
      - node: native-transcript-jsonl
        action: Append authoritative assistant/tool records only when accepted events exist, preserving native order.
      - node: session-application
        action: After any required durable persistence and cleanup, settle completion, cancellation, or failure exactly once without replaying accepted provider or tool side effects.
      - node: tui-adapter
        action: Present the terminal state and resulting conversation.
    evidence:
      - path: src/application/session-service.ts
        symbol: ClaudeSessionService
        confidence: confirmed
      - path: src/application/turn-lifecycle.ts
        symbol: TurnCoordinator
        confidence: confirmed
      - path: src/core/runtime.ts
        symbol: AgentRuntime
        confidence: confirmed
      - path: src/cli/interactive.tsx
        symbol: InteractiveApp
        confidence: confirmed
      - path: src/persistence/native-transcript-store.ts
        symbol: NativeTranscriptStore
        confidence: confirmed

  - id: native-persistence-flow
    name: Native persistence
    critical: true
    steps:
      - node: session-application
        action: Stage a command and its provider-neutral events for persistence.
      - node: native-persistence
        action: Acquire the native transcript lease and validate the current tail; lease or tail conflict or append failure returns without publishing the staged projection or later effects.
      - node: native-transcript-jsonl
        action: Commit an append-only versioned JSONL batch.
      - node: native-persistence
        action: Return the typed receipt only after the durable append succeeds.
      - node: session-application
        action: Publish staged projection and run post-commit hooks and accounting only after receipt success.
    evidence:
      - path: src/application/turn-persistence.ts
        symbol: TurnPersistence
        confidence: confirmed
      - path: src/persistence/native-transcript-store.ts
        symbol: NativeTranscriptStore
        confidence: confirmed
      - path: src/persistence/native-transcript-codec.ts
        symbol: createNativeTranscriptCodec
        confidence: confirmed

  - id: tool-admission-and-settlement
    name: Tool admission and settlement
    critical: true
    steps:
      - node: core-runtime
        action: Validate and schedule a process-backed model tool call.
      - node: integration-adapters
        action: Run configured PreToolUse integration checks.
      - node: tool-security-runtime
        action: Resolve permission and sandbox admission; default-eval Bash preapproval requires static semantic and path safety inside eval-authorized roots, and malformed or denied calls fail closed without execution.
      - node: local-process-boundary
        action: Execute only the admitted process-backed call.
      - node: project-workspace
        action: Receive the admitted command effects when the command mutates workspace files.
      - node: native-persistence
        action: Settle native tool-start and tool-completion records.
      - node: core-runtime
        action: Continue the agent loop from the settled result.
    evidence:
      - path: src/core/tool-execution-scheduler.ts
        symbol: ToolExecutionScheduler
        confidence: confirmed
      - path: src/permissions/claude-permission-resolver.ts
        symbol: ClaudePermissionResolver
        confidence: confirmed
      - path: src/evals/eval-tool-admission.ts
        symbol: isEvalToolCallPreapproved
        confidence: confirmed
      - path: src/cli-runtime.ts
        symbol: defaultPluginEvalRuntimeFactory
        confidence: confirmed
      - path: src/sandbox/claude-sandbox-runtime.ts
        symbol: ClaudeSandboxRuntime
        confidence: confirmed
      - path: src/platform/bounded-process-runner.ts
        symbol: BoundedProcessRunner
        confidence: confirmed
      - path: src/hooks/claude-hooks.ts
        symbol: ClaudeHookRunner
        confidence: confirmed

  - id: provider-fallback
    name: Provider fallback
    critical: true
    steps:
      - node: session-application
        action: Allocate a fresh turn-scoped provider stack.
      - node: provider-gateway
        action: Buffer the primary attempt before committing output or route state.
      - node: model-provider-apis
        action: Return an error before any buffered events are accepted; buffered partial output remains private to the provider gateway.
      - node: provider-gateway
        action: Classify the buffered result before continuation; incompatible, nonretryable, or otherwise ineligible failures fail closed without exposing buffered partial events.
      - node: provider-gateway
        action: For an eligible failure, retry through the declared fallback or explicitly eligible non-streaming route.
      - node: model-provider-apis
        action: Return the fallback protocol result or error to the provider gateway.
      - node: provider-gateway
        action: Obtain one successful complete result and seal the route for subsequent continuations.
