schema_version: '1.1'
name: long-context-resume
risk: high
fixture: fixture
execution:
  prompt: Read the notes and summarize the seed.
  max_turns: 8
  timeout_seconds: 30
  allowed_tools: [Read]
  env:
    EVAL_SCENARIO: long-context-resume
graders:
  - type: regex
    name: resumed
    target: last_message
    pattern: RESUME_OK
    match: contains
expect:
  allowed_changed_paths: []
  expected_changed_paths: []
  forbidden_changed_paths: []
