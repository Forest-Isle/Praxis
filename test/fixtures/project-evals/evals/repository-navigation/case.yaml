schema_version: '1.0'
name: repository-navigation
fixture: fixture
execution:
  prompt: Find the configured API endpoint without changing files.
  max_turns: 8
  timeout_seconds: 30
  allowed_tools: [Glob, Grep, Read]
  env:
    EVAL_SCENARIO: repository-navigation
graders:
  - type: regex
    name: found-endpoint
    target: last_message
    pattern: api.example.test
    match: contains
expect:
  allowed_changed_paths: []
  expected_changed_paths: []
  forbidden_changed_paths: []
