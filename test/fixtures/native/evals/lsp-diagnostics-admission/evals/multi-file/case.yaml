schema_version: '1.1'
name: multi-file
risk: high
fixture: fixture
execution:
  prompt: Repair alpha.cjs and beta.cjs after the batch edit and finish.
  max_turns: 8
  timeout_seconds: 30
  allowed_tools: [Read, Edit, ApplyPatch, Bash]
  env:
    EVAL_SCENARIO: multi-file
verification:
  - name: files-check
    required: true
    expect: pass
    command: node
    args:
      - -e
      - "const fs=require('node:fs');if(require('./alpha.cjs').value!=='alpha'||require('./beta.cjs').value!=='beta')process.exit(1)"
    timeout_seconds: 10
graders: []
expect:
  allowed_changed_paths: [alpha.cjs, beta.cjs]
  expected_changed_paths: [alpha.cjs, beta.cjs]
  forbidden_changed_paths: []
