schema_version: '1.1'
name: single-file
risk: medium
fixture: fixture
execution:
  prompt: Repair service.cjs after the edit and finish.
  max_turns: 8
  timeout_seconds: 30
  allowed_tools: [Read, Edit, ApplyPatch, Bash]
  env:
    EVAL_SCENARIO: single-file
verification:
  - name: service-check
    required: true
    expect: pass
    command: node
    args:
      - -e
      - "if(require('./service.cjs').value!=='ok')process.exit(1)"
    timeout_seconds: 10
graders: []
expect:
  allowed_changed_paths: [service.cjs]
  expected_changed_paths: [service.cjs]
  forbidden_changed_paths: []
