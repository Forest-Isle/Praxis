schema_version: '1.0'
name: multi-file
fixture: fixture
execution:
  prompt: Update alpha.txt and beta.txt.
  max_turns: 8
  timeout_seconds: 30
  allowed_tools: [Read, Edit, ApplyPatch]
  env:
    EVAL_SCENARIO: multi-file
verification:
  - name: files-check
    command: node
    args:
      - -e
      - "const fs=require('node:fs');if(fs.readFileSync('alpha.txt','utf8')!=='alpha=two\\n'||fs.readFileSync('beta.txt','utf8')!=='beta=two\\n')process.exit(1)"
    timeout_seconds: 10
graders: []
expect:
  allowed_changed_paths: [alpha.txt, beta.txt]
  expected_changed_paths: [alpha.txt, beta.txt]
  forbidden_changed_paths: []
