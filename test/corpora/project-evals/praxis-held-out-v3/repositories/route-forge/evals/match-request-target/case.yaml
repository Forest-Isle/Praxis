schema_version: '1.1'
name: route-forge.match-request-target
risk: medium
tags: [held-out, praxis-held-out-v3, route-forge]
runs: 3
fixture: fixture
execution:
  prompt: >-
    Update src/index.mjs so matchRequest strips the query and fragment from a
    request target, uses / for an empty path, and delegates to matchRoute;
    leave src/router.mjs unchanged.
  max_turns: 12
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Edit, Write, Bash]
  env: {}
verification:
  - name: request-target
    command: node
    args:
      - --input-type=module
      - -e
      - >-
        import { matchRequest } from './src/index.mjs';
        try { const result = matchRequest([{path:'/users/:id',name:'user'}], '/users/42?tab=posts#bio'); const fragmentFirst = matchRequest([{path:'/users/:id',name:'user'}], '/users/7#bio?tab=posts'); const root = matchRequest([{path:'/',name:'root'}], '?health=1'); if (result?.name !== 'user' || result.params.id !== '42' || fragmentFirst?.params.id !== '7' || root?.name !== 'root') process.exit(42); process.exit(0); } catch (error) { console.error(String(error?.message ?? error)); process.exit(1); }
    timeout_seconds: 30
    required: true
    expect: pass
graders: []
expect:
  allowed_changed_paths: [src/index.mjs]
  expected_changed_paths: [src/index.mjs]
  forbidden_changed_paths:
    [src/router.mjs, .git/**, .praxis/**, .env, '**/.env', secrets/**]
