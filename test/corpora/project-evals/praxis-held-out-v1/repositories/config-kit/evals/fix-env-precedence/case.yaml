schema_version: '1.1'
name: config-kit.fix-env-precedence
risk: medium
fixture: fixture
tags: [held-out, praxis-held-out-v1, config-kit]
runs: 3
execution:
  prompt: In src/config.cjs, make each defined environment value override its file value while preserving unspecified file values; for file {port:4000,host:file} and env {port:5000}, the result must retain host:file and use port 5000.
  max_turns: 12
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Edit, Write, Bash]
  env: {}
verification:
  - name: behavior
    command: node
    args:
      [
        -e,
        "const {loadConfig}=require('./src/config.cjs'); const r=loadConfig({port:4000,host:'file'},{port:5000}); if(r.port!==5000||r.host!=='file')process.exit(1)",
      ]
    timeout_seconds: 30
    required: true
    expect: pass
graders: []
expect:
  allowed_changed_paths: [src/config.cjs]
  expected_changed_paths: [src/config.cjs]
  forbidden_changed_paths:
    [src/cli.cjs, .git/**, .praxis/**, .env, '**/.env', secrets/**]
