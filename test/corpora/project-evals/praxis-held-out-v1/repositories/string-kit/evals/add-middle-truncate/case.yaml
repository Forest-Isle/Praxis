schema_version: '1.1'
name: string-kit.add-middle-truncate
risk: medium
fixture: fixture
tags: [held-out, praxis-held-out-v1, string-kit]
runs: 3
execution:
  prompt: In src/index.cjs, export truncateMiddle(value, maxLength); values no longer than maxLength remain unchanged, and truncateMiddle('abcdefghij', 7) must return 'abc…hij'.
  max_turns: 12
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Edit, Write, Bash]
  env: {}
verification:
  - name: behavior
    command: node
    args:
      [
        -e,
        "const {truncateMiddle}=require('./src/index.cjs'); if(typeof truncateMiddle!=='function'||truncateMiddle('short',8)!=='short'||truncateMiddle('abcdefghij',7)!=='abc…hij')process.exit(1)",
      ]
    timeout_seconds: 30
    required: true
    expect: pass
graders: []
expect:
  allowed_changed_paths: [src/index.cjs]
  expected_changed_paths: [src/index.cjs]
  forbidden_changed_paths:
    [src/slug.cjs, .git/**, .praxis/**, .env, '**/.env', secrets/**]
