schema_version: '1.1'
name: event-window.dedupe-latest
risk: medium
fixture: fixture
tags: [held-out, praxis-held-out-v2, event-window]
runs: 3
execution:
  prompt: In src/events.cjs, make dedupeLatest(events) choose the greatest at per ID, choose the later occurrence on a timestamp tie, return winners ordered by their selected original indices, and leave the input array and objects unchanged.
  max_turns: 12
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Edit, Write, Bash]
  env: {}
verification:
  - name: behavior
    command: node
    args:
      [
        -e,
        "const {dedupeLatest}=require('./src/events.cjs');const e=[{id:'a',at:1,v:'old'},{id:'b',at:5},{id:'a',at:3,v:'new'},{id:'b',at:2},{id:'c',at:7,v:'first'},{id:'c',at:7,v:'last'}],b=JSON.stringify(e),r=dedupeLatest(e);if(JSON.stringify(r)!==JSON.stringify([{id:'b',at:5},{id:'a',at:3,v:'new'},{id:'c',at:7,v:'last'}])||JSON.stringify(e)!==b)process.exit(1)",
      ]
    timeout_seconds: 30
    required: true
    expect: pass
graders: []
expect:
  allowed_changed_paths: [src/events.cjs]
  expected_changed_paths: [src/events.cjs]
  forbidden_changed_paths:
    [src/window.cjs, .git/**, .praxis/**, .env, '**/.env', secrets/**]
