schema_version: '1.1'
name: event-window.count-inclusive-window
risk: medium
fixture: fixture
tags: [held-out, praxis-held-out-v2, event-window]
runs: 3
execution:
  prompt: In src/window.cjs, make countInWindow(events, start, end) count only numeric at values inclusively at both bounds, exclude values outside the window, and leave the input unchanged.
  max_turns: 12
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Edit, Write, Bash]
  env: {}
verification:
  - name: behavior
    command: node
    args:
      [
        -e,
        "const {countInWindow}=require('./src/window.cjs');const e=[{at:0},{at:1},{at:2},{at:3},{at:4},{at:'2'}],b=JSON.stringify(e);if(countInWindow(e,1,3)!==3||JSON.stringify(e)!==b)process.exit(1)",
      ]
    timeout_seconds: 30
    required: true
    expect: pass
graders: []
expect:
  allowed_changed_paths: [src/window.cjs]
  expected_changed_paths: [src/window.cjs]
  forbidden_changed_paths:
    [src/events.cjs, .git/**, .praxis/**, .env, '**/.env', secrets/**]
