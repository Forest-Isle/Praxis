schema_version: '1.1'
name: interval-set.add-merged-range
risk: medium
fixture: fixture
tags: [held-out, praxis-held-out-v2, interval-set]
runs: 3
execution:
  prompt: In src/intervals.cjs, make addRange(ranges, range) return a new sorted canonical array that transitively merges overlaps and shared endpoints, without mutating the existing ranges or added range.
  max_turns: 12
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Edit, Write, Bash]
  env: {}
verification:
  - name: behavior
    command: node
    args:
      [
        -e,
        "const {addRange}=require('./src/intervals.cjs');const r=[[1,3],[8,10]],n=[3,8],rb=JSON.stringify(r),nb=JSON.stringify(n),o=addRange(r,n);if(o===r||JSON.stringify(o)!=='[[1,10]]'||JSON.stringify(r)!==rb||JSON.stringify(n)!==nb)process.exit(1)",
      ]
    timeout_seconds: 30
    required: true
    expect: pass
graders: []
expect:
  allowed_changed_paths: [src/intervals.cjs]
  expected_changed_paths: [src/intervals.cjs]
  forbidden_changed_paths:
    [src/query.cjs, .git/**, .praxis/**, .env, '**/.env', secrets/**]
