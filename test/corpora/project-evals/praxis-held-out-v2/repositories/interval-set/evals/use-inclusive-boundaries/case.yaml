schema_version: '1.1'
name: interval-set.use-inclusive-boundaries
risk: medium
fixture: fixture
tags: [held-out, praxis-held-out-v2, interval-set]
runs: 3
execution:
  prompt: In src/query.cjs, make containsPoint(ranges, point) include both endpoints of every range, exclude outside values, and leave the input unchanged.
  max_turns: 12
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Edit, Write, Bash]
  env: {}
verification:
  - name: behavior
    command: node
    args:
      [
        -e,
        "const {containsPoint}=require('./src/query.cjs');const r=[[1,3]],b=JSON.stringify(r);if(!containsPoint(r,1)||!containsPoint(r,3)||containsPoint(r,0)||containsPoint(r,4)||JSON.stringify(r)!==b)process.exit(1)",
      ]
    timeout_seconds: 30
    required: true
    expect: pass
graders: []
expect:
  allowed_changed_paths: [src/query.cjs]
  expected_changed_paths: [src/query.cjs]
  forbidden_changed_paths:
    [src/intervals.cjs, .git/**, .praxis/**, .env, '**/.env', secrets/**]
