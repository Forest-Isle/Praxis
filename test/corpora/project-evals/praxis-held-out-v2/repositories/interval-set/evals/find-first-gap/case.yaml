schema_version: '1.1'
name: interval-set.find-first-gap
risk: medium
fixture: fixture
tags: [held-out, praxis-held-out-v2, interval-set]
runs: 3
execution:
  prompt: In src/query.cjs, make firstGap(ranges, start, end) accept inclusive integer ranges in any order and return the smallest uncovered integer in inclusive [start, end], or null when fully covered, without mutation.
  max_turns: 12
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Edit, Write, Bash]
  env: {}
verification:
  - name: behavior
    command: node
    args:
      [
        -e,
        "const {firstGap}=require('./src/query.cjs');const a=[[5,6],[1,2]],b=[[1,3],[4,6]],ab=JSON.stringify(a),bb=JSON.stringify(b);if(firstGap(a,1,6)!==3||firstGap(b,1,6)!==null||firstGap([],2,2)!==2||JSON.stringify(a)!==ab||JSON.stringify(b)!==bb)process.exit(1)",
      ]
    timeout_seconds: 30
    required: true
    expect: pass
graders: []
expect:
  allowed_changed_paths: [src/query.cjs]
  expected_changed_paths: [src/query.cjs]
  forbidden_changed_paths:
    [src/intervals.cjs, .git/**, .praxis/**, .env, '**/.env', secrets/**]
