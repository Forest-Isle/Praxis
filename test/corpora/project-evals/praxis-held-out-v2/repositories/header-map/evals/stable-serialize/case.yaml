schema_version: '1.1'
name: header-map.stable-serialize
risk: medium
fixture: fixture
tags: [held-out, praxis-held-out-v2, header-map]
runs: 3
execution:
  prompt: In src/serialize.cjs, make serializeHeaders(headers) sort keys by lowercase ASCII lexicographic order with the original key as tie-breaker, preserve spelling and values, append a newline per entry, and leave headers unchanged.
  max_turns: 12
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Edit, Write, Bash]
  env: {}
verification:
  - name: behavior
    command: node
    args:
      [
        -e,
        "const {serializeHeaders}=require('./src/serialize.cjs');const h={'X-Z':'3',accept:'1','Content-Type':'2',a:'lower',A:'upper'},b=JSON.stringify(h),r=serializeHeaders(h);if(r!=='A: upper\\na: lower\\naccept: 1\\nContent-Type: 2\\nX-Z: 3\\n'||JSON.stringify(h)!==b)process.exit(1)",
      ]
    timeout_seconds: 30
    required: true
    expect: pass
graders: []
expect:
  allowed_changed_paths: [src/serialize.cjs]
  expected_changed_paths: [src/serialize.cjs]
  forbidden_changed_paths:
    [src/headers.cjs, .git/**, .praxis/**, .env, '**/.env', secrets/**]
