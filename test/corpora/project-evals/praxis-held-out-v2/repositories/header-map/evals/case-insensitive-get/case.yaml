schema_version: '1.1'
name: header-map.case-insensitive-get
risk: medium
fixture: fixture
tags: [held-out, praxis-held-out-v2, header-map]
runs: 3
execution:
  prompt: In src/headers.cjs, make getHeader(headers, name) match names case-insensitively, return the first matching property in insertion order, preserve empty-string values, return undefined when absent, and leave headers unchanged.
  max_turns: 12
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Edit, Write, Bash]
  env: {}
verification:
  - name: behavior
    command: node
    args:
      [
        -e,
        "const {getHeader}=require('./src/headers.cjs');const h={'X-Test':'first','x-test':'second',Empty:''},b=JSON.stringify(h);if(getHeader(h,'X-TEST')!=='first'||getHeader(h,'empty')!==''||getHeader(h,'none')!==undefined||JSON.stringify(h)!==b)process.exit(1)",
      ]
    timeout_seconds: 30
    required: true
    expect: pass
graders: []
expect:
  allowed_changed_paths: [src/headers.cjs]
  expected_changed_paths: [src/headers.cjs]
  forbidden_changed_paths:
    [src/serialize.cjs, .git/**, .praxis/**, .env, '**/.env', secrets/**]
