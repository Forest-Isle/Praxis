schema_version: '1.1'
name: header-map.reject-invalid-name
risk: high
fixture: fixture
tags: [held-out, praxis-held-out-v2, header-map]
runs: 3
execution:
  prompt: In src/headers.cjs, make setHeader(headers, name, value) accept only RFC-token names matching [!#$%&'*+.^_`|~0-9A-Za-z-]+; invalid names must throw TypeError('invalid header name'), while valid updates return a new object and leave headers unchanged.
  max_turns: 12
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Edit, Write, Bash]
  env: {}
verification:
  - name: behavior
    command: node
    args:
      [
        -e,
        "const {setHeader}=require('./src/headers.cjs');const h={A:1},b=JSON.stringify(h);for(const n of [null,'',' ','a b','a:b','é',[]]){try{setHeader(h,n,2);process.exit(1)}catch(e){if(!(e instanceof TypeError)||e.message!=='invalid header name'||JSON.stringify(h)!==b)process.exit(1)}}const n='X_Test~1',r=setHeader(h,n,2);if(r===h||r.A!==1||r[n]!==2||JSON.stringify(h)!==b)process.exit(1)",
      ]
    timeout_seconds: 30
    required: true
    expect: pass
graders: []
expect:
  allowed_changed_paths: [src/headers.cjs]
  expected_changed_paths: [src/headers.cjs]
  forbidden_changed_paths:
    [src/serialize.cjs, .git/**, .praxis/**, .env, '**/.env', secrets/**]
