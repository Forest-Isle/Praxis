schema_version: '1.1'
name: csv-lens.reject-ragged-records
risk: medium
tags: [held-out, praxis-held-out-v4, csv-lens]
runs: 3
fixture: fixture
execution:
  prompt: >-
    In src/csv.mjs, export parseCsvTable(value). Accept LF and CRLF row separators and one final newline without producing an extra empty row, and use the first row width as the table contract. The input a,b\r\n1,2\r\n3,4\r\n must return [["a","b"],["1","2"],["3","4"]]. For the first ragged data row, throw exactly Row <n> has <actual> fields; expected <expected> with one-based row numbers; a,b,c\n1,2,3\n4,5\n must throw Row 3 has 2 fields; expected 3.
  max_turns: 12
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Edit, Write, Bash]
  env: {}
verification:
  - name: behavior
    command: node
    args:
      - -e
      - |
        const assert = require('node:assert/strict')
        const { pathToFileURL } = require('node:url')
        ;(async () => {
          const m = await import(pathToFileURL(`${process.argv[1]}/src/csv.mjs`).href)
          if (!Object.hasOwn(m, 'parseCsvTable')) process.exit(42)
          const f = m.parseCsvTable
          assert.equal(typeof f, 'function')
          const rows = [['a', 'b'], ['1', '2'], ['3', '4']]
          assert.deepEqual(f('a,b\r\n1,2\r\n3,4\r\n'), rows)
          assert.deepEqual(f('a,b\n1,2\n3,4\n'), rows)
          assert.throws(
            () => f('a,b,c\n1,2,3\n4,5\n'),
            { message: 'Row 3 has 2 fields; expected 3' },
          )
          assert.throws(
            () => f('a,b,c\n1,2\n3,4,5,6\n'),
            { message: 'Row 2 has 2 fields; expected 3' },
          )
        })().then(() => process.exit(0), () => process.exit(1))
    timeout_seconds: 30
    required: true
    expect: pass
graders: []
expect:
  allowed_changed_paths: [src/csv.mjs]
  expected_changed_paths: [src/csv.mjs]
  forbidden_changed_paths:
    [src/other.mjs, .git/**, .praxis/**, .env, '**/.env', secrets/**]
