name: Bug report
description: Report a reproducible Praxis defect
title: 'bug: '
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: Do not include API keys or private transcripts.
  - type: input
    id: version
    attributes:
      label: Praxis version
      placeholder: praxis --version
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options: [macOS, Linux, Other]
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: node --version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal commands, configuration, and inputs needed to reproduce.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Redacted logs or compatibility details.
