name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install terminal and Linux sandbox test tools
        run: |
          if ! command -v rg >/dev/null || ! command -v expect >/dev/null || ! command -v tmux >/dev/null || ! command -v bwrap >/dev/null || ! command -v socat >/dev/null; then
            # GitHub-hosted Ubuntu runners point apt at azure.archive.ubuntu.com,
            # which is sometimes unreachable. Rewrite the mirror selection to the
            # canonical archive.ubuntu.com when the runner exposes it, and keep the
            # runner defaults when the mirror metadata or source file is absent.
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g' /etc/apt/apt-mirrors.txt
            fi
            for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list; do
              [ -f "$source" ] || continue
              sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g' "$source"
            done
            timeout 180s sudo apt-get update \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30
            timeout 180s sudo apt-get install -y ripgrep expect tmux bubblewrap socat
          fi
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)" = "1" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          command -v rg >/dev/null
          command -v expect >/dev/null
          command -v tmux >/dev/null
          command -v bwrap >/dev/null
          command -v socat >/dev/null
      - name: Install dependencies
        run: npm ci
      - name: Run quality gates
        run: npm run check

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run coverage
        run: npm run test:coverage

  release-regression:
    name: Release regression (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [24, 25]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify installed release package
        run: npm run test:package

  required:
    name: CI
    if: always()
    needs: [quality, coverage, release-regression]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI lane
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          RELEASE_RESULT: ${{ needs.release-regression.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$COVERAGE_RESULT" = success
          test "$RELEASE_RESULT" = success
