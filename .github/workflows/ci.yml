name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install ripgrep
        run: command -v rg >/dev/null || (sudo apt-get update && sudo apt-get install -y ripgrep)
      - name: Install dependencies
        run: npm ci
      - name: Run quality gates
        run: npm run check
      - name: Audit production dependencies
        run: npm audit --omit=dev

  compatibility:
    name: Claude CLI contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install ripgrep
        run: command -v rg >/dev/null || (sudo apt-get update && sudo apt-get install -y ripgrep)
      - name: Install dependencies and compatibility baseline
        run: |
          npm ci
          npm install --global @anthropic-ai/claude-code@2.1.208
      - name: Verify pinned Claude baseline
        run: test "$(claude --version | awk '{print $1}')" = "2.1.208"
      - name: Verify credential-free Claude CLI contract
        run: npm run test:cli-surface-compat

  release-regression:
    name: Release regression (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [24, 25]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install ripgrep on Linux
        if: runner.os == 'Linux'
        run: command -v rg >/dev/null || (sudo apt-get update && sudo apt-get install -y ripgrep)
      - name: Install ripgrep on macOS
        if: runner.os == 'macOS'
        run: command -v rg >/dev/null || brew install ripgrep
      - name: Install dependencies
        run: npm ci
      - name: Verify installed release package
        run: npm run test:package
      - name: Verify performance budgets
        if: runner.os == 'Linux' && matrix.node == 24 || runner.os == 'macOS' && matrix.node == 25
        run: npm run test:performance

  required:
    name: CI
    if: always()
    needs: [quality, compatibility, release-regression]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI lane
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
          RELEASE_RESULT: ${{ needs.release-regression.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$COMPATIBILITY_RESULT" = success
          test "$RELEASE_RESULT" = success
