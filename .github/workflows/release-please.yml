name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release:
    name: Propose or create release
    runs-on: ubuntu-latest
    timeout-minutes: 135
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Resolve release pull request
        id: resolve-release-pr
        if: steps.release.outputs.prs_created == 'true' || steps.release.outputs.release_created != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
          PRS_CREATED: ${{ steps.release.outputs.prs_created }}
        run: |
          if test "$PRS_CREATED" = "true"; then
            PR_NUMBER=$(jq -r '.number // empty' <<< "$RELEASE_PR")
            HEAD_BRANCH=$(jq -r '.headBranchName // empty' <<< "$RELEASE_PR")
            test -n "$PR_NUMBER"
            test -n "$HEAD_BRANCH"
            PR_JSON=$(jq -cn --arg number "$PR_NUMBER" --arg headBranchName "$HEAD_BRANCH" \
              '{number: $number, headBranchName: $headBranchName}')
            printf 'pr=%s\n' "$PR_JSON" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MATCHING_PR=$(gh pr list --repo "$GITHUB_REPOSITORY" \
            --state open --base main --label 'autorelease: pending' \
            --json number,headRefName,headRefOid)
          PR_COUNT=$(jq 'length' <<< "$MATCHING_PR")
          if test "$PR_COUNT" -gt 1; then
            printf 'Multiple open autorelease: pending release pull requests for main: %s\n' \
              "$MATCHING_PR" >&2
            exit 1
          fi
          if test "$PR_COUNT" -eq 1; then
            PR_NUMBER=$(jq -r '.[0].number // empty' <<< "$MATCHING_PR")
            HEAD_BRANCH=$(jq -r '.[0].headRefName // empty' <<< "$MATCHING_PR")
            test -n "$PR_NUMBER"
            test -n "$HEAD_BRANCH"
            PR_JSON=$(jq -cn --arg number "$PR_NUMBER" --arg headBranchName "$HEAD_BRANCH" \
              '{number: $number, headBranchName: $headBranchName}')
            printf 'pr=%s\n' "$PR_JSON" >> "$GITHUB_OUTPUT"
          fi
      - name: Run protected checks and enable automatic merge
        if: steps.resolve-release-pr.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ steps.resolve-release-pr.outputs.pr }}
        run: |
          PR_NUMBER=$(jq -r '.number // empty' <<< "$RELEASE_PR")
          HEAD_BRANCH=$(jq -r '.headBranchName // empty' <<< "$RELEASE_PR")
          test -n "$PR_NUMBER"
          test -n "$HEAD_BRANCH"
          PR_DETAILS=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json autoMergeRequest,headRefName,headRefOid,state)
          test "$(jq -r '.headRefName' <<< "$PR_DETAILS")" = "$HEAD_BRANCH"
          HEAD_SHA=$(jq -r '.headRefOid // empty' <<< "$PR_DETAILS")
          test -n "$HEAD_SHA"
          WORKFLOWS=(ci.yml codeql.yml dependency-review.yml)
          declare -A PREVIOUS_RUN_IDS
          declare -A OBSERVED_RUN_IDS
          declare -A OBSERVED_RUN_URLS
          declare -A WORKFLOW_RESULTS
          for CHECK_NAME in CI 'Dependency review'; do
            gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
              -f state=pending -f context="$CHECK_NAME" \
              -f description="Verified release workflow is running"
          done
          for WORKFLOW in "${WORKFLOWS[@]}"; do
            PREVIOUS_RUN_IDS[$WORKFLOW]=$(gh run list \
              --repo "$GITHUB_REPOSITORY" --workflow "$WORKFLOW" \
              --branch "$HEAD_BRANCH" --event workflow_dispatch --limit 20 \
              --json databaseId,headSha | jq -r --arg sha "$HEAD_SHA" \
              '[.[] | select(.headSha == $sha)] | max_by(.databaseId).databaseId // 0')
            if test "$WORKFLOW" = dependency-review.yml; then
              gh workflow run "$WORKFLOW" --repo "$GITHUB_REPOSITORY" \
                --ref "$HEAD_BRANCH" -f base_ref=main \
                -f head_ref="$HEAD_BRANCH"
            else
              gh workflow run "$WORKFLOW" --repo "$GITHUB_REPOSITORY" \
                --ref "$HEAD_BRANCH"
            fi
          done
          AUTO_MERGE=$(jq -r \
            'if .state != "OPEN" then .state elif .autoMergeRequest == null then "disabled" else "enabled" end' \
            <<< "$PR_DETAILS")
          if test "$AUTO_MERGE" = "disabled"; then
            gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash --delete-branch
          else
            test "$AUTO_MERGE" = "enabled"
          fi
          FAILED_WORKFLOWS=()
          for WORKFLOW in "${WORKFLOWS[@]}"; do
            DEADLINE=$((SECONDS + 2400))
            PREVIOUS_RUN_ID=${PREVIOUS_RUN_IDS[$WORKFLOW]}
            while true; do
              RUNS=$(gh run list --repo "$GITHUB_REPOSITORY" \
                --workflow "$WORKFLOW" --branch "$HEAD_BRANCH" \
                --event workflow_dispatch --limit 20 \
                --json databaseId,headSha,status,conclusion,url)
              RUN=$(jq -c --arg sha "$HEAD_SHA" \
                --argjson previous "$PREVIOUS_RUN_ID" \
                '[.[] | select(.headSha == $sha and .databaseId > $previous)] | max_by(.databaseId) // empty' \
                <<< "$RUNS")
              if test -n "$RUN"; then
                RUN_ID=$(jq -r '.databaseId' <<< "$RUN")
                if test "$(jq -r '.status' <<< "$RUN")" != "completed"; then
                  gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
                    --exit-status || true
                fi
                CONCLUSION=$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
                  --json conclusion --jq '.conclusion')
                WORKFLOW_RESULTS[$WORKFLOW]=$CONCLUSION
                OBSERVED_RUN_IDS[$WORKFLOW]=$RUN_ID
                OBSERVED_RUN_URLS[$WORKFLOW]=$(jq -r '.url' <<< "$RUN")
                if test "$CONCLUSION" != "success"; then
                  FAILED_WORKFLOWS+=("$WORKFLOW:$CONCLUSION")
                fi
                break
              fi
              if test "$SECONDS" -ge "$DEADLINE"; then
                WORKFLOW_RESULTS[$WORKFLOW]=timeout
                FAILED_WORKFLOWS+=("$WORKFLOW:timeout")
                break
              fi
              sleep 5
            done
          done
          CURRENT_PR=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json headRefName,headRefOid,state)
          test "$(jq -r '.state' <<< "$CURRENT_PR")" = "OPEN"
          test "$(jq -r '.headRefName' <<< "$CURRENT_PR")" = "$HEAD_BRANCH"
          test "$(jq -r '.headRefOid' <<< "$CURRENT_PR")" = "$HEAD_SHA"
          for WORKFLOW in ci.yml dependency-review.yml; do
            case "$WORKFLOW" in
              ci.yml) CHECK_NAME=CI ;;
              dependency-review.yml) CHECK_NAME='Dependency review' ;;
            esac
            RESULT=${WORKFLOW_RESULTS[$WORKFLOW]:-timeout}
            RUN_ID=${OBSERVED_RUN_IDS[$WORKFLOW]:-}
            RUN_URL=${OBSERVED_RUN_URLS[$WORKFLOW]:-}
            if test "$RESULT" = "success"; then
              test -n "$RUN_ID"
              test -n "$RUN_URL"
              gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
                -f state=success -f context="$CHECK_NAME" \
                -f description="Verified by dispatched workflow run $RUN_ID" \
                -f target_url="$RUN_URL"
            elif test -n "$RUN_URL"; then
              gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
                -f state=failure -f context="$CHECK_NAME" \
                -f description="Dispatched workflow finished with $RESULT" \
                -f target_url="$RUN_URL"
            else
              gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
                -f state=failure -f context="$CHECK_NAME" \
                -f description="Dispatched workflow timed out before a run was observed"
            fi
          done
          test "${#FAILED_WORKFLOWS[@]}" -eq 0 || {
            printf 'Release required workflows failed: %s\n' \
              "${FAILED_WORKFLOWS[*]}" >&2
            exit 1
          }
          MERGE_DEADLINE=$((SECONDS + 600))
          while true; do
            MERGE_DETAILS=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --json state,mergeStateStatus)
            PR_STATE=$(jq -r '.state' <<< "$MERGE_DETAILS")
            PR_MERGE_STATE=$(jq -r '.mergeStateStatus' <<< "$MERGE_DETAILS")
            if test "$PR_STATE" = "MERGED"; then
              gh workflow run release-please.yml --repo "$GITHUB_REPOSITORY" \
                --ref main
              break
            fi
            if test "$PR_STATE" != "OPEN"; then
              printf 'Release pull request closed without merging; release handoff was not dispatched\n'
              break
            fi
            if test "$PR_MERGE_STATE" = "BEHIND"; then
              printf 'Release pull request is behind main; ending this run so the next main run can refresh it\n'
              break
            fi
            if test "$SECONDS" -ge "$MERGE_DEADLINE"; then
              printf 'Release pull request remains open after protected checks; auto-merge remains enabled\n'
              break
            fi
            sleep 3
          done
      - name: Dispatch release publication
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          jq -n --arg tag "$RELEASE_TAG" \
            '{event_type:"release-created",client_payload:{tag_name:$tag}}' |
            gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" --input -
