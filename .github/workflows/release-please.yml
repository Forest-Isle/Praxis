name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  checks: write
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release:
    name: Propose or create release
    runs-on: ubuntu-latest
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Run protected checks and enable automatic merge
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          PR_NUMBER=$(jq -r '.number // empty' <<< "$RELEASE_PR")
          HEAD_BRANCH=$(jq -r '.headBranchName // empty' <<< "$RELEASE_PR")
          test -n "$PR_NUMBER"
          test -n "$HEAD_BRANCH"
          PR_DETAILS=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json autoMergeRequest,headRefName,headRefOid,state)
          test "$(jq -r '.headRefName' <<< "$PR_DETAILS")" = "$HEAD_BRANCH"
          HEAD_SHA=$(jq -r '.headRefOid // empty' <<< "$PR_DETAILS")
          test -n "$HEAD_SHA"
          WORKFLOWS=(ci.yml codeql.yml dependency-review.yml)
          declare -A PREVIOUS_RUN_IDS
          declare -A COMPLETED_RUN_IDS
          declare -A COMPLETED_RUN_URLS
          for WORKFLOW in "${WORKFLOWS[@]}"; do
            PREVIOUS_RUN_IDS[$WORKFLOW]=$(gh run list \
              --repo "$GITHUB_REPOSITORY" --workflow "$WORKFLOW" \
              --branch "$HEAD_BRANCH" --event workflow_dispatch --limit 20 \
              --json databaseId,headSha | jq -r --arg sha "$HEAD_SHA" \
              '[.[] | select(.headSha == $sha)] | max_by(.databaseId).databaseId // 0')
            if test "$WORKFLOW" = dependency-review.yml; then
              gh workflow run "$WORKFLOW" --repo "$GITHUB_REPOSITORY" \
                --ref "$HEAD_BRANCH" -f base_ref=main \
                -f head_ref="$HEAD_BRANCH"
            else
              gh workflow run "$WORKFLOW" --repo "$GITHUB_REPOSITORY" \
                --ref "$HEAD_BRANCH"
            fi
          done
          AUTO_MERGE=$(jq -r \
            'if .state != "OPEN" then .state elif .autoMergeRequest == null then "disabled" else "enabled" end' \
            <<< "$PR_DETAILS")
          if test "$AUTO_MERGE" = "disabled"; then
            gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash --delete-branch
          else
            test "$AUTO_MERGE" = "enabled"
          fi
          FAILED_WORKFLOWS=()
          for WORKFLOW in "${WORKFLOWS[@]}"; do
            DEADLINE=$((SECONDS + 2400))
            PREVIOUS_RUN_ID=${PREVIOUS_RUN_IDS[$WORKFLOW]}
            while true; do
              RUNS=$(gh run list --repo "$GITHUB_REPOSITORY" \
                --workflow "$WORKFLOW" --branch "$HEAD_BRANCH" \
                --event workflow_dispatch --limit 20 \
                --json databaseId,headSha,status,conclusion,url)
              RUN=$(jq -c --arg sha "$HEAD_SHA" \
                --argjson previous "$PREVIOUS_RUN_ID" \
                '[.[] | select(.headSha == $sha and .databaseId > $previous)] | max_by(.databaseId) // empty' \
                <<< "$RUNS")
              if test -n "$RUN"; then
                RUN_ID=$(jq -r '.databaseId' <<< "$RUN")
                if test "$(jq -r '.status' <<< "$RUN")" != "completed"; then
                  gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
                    --exit-status || true
                fi
                CONCLUSION=$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
                  --json conclusion --jq '.conclusion')
                if test "$CONCLUSION" != "success"; then
                  FAILED_WORKFLOWS+=("$WORKFLOW:$CONCLUSION")
                else
                  COMPLETED_RUN_IDS[$WORKFLOW]=$RUN_ID
                  COMPLETED_RUN_URLS[$WORKFLOW]=$(jq -r '.url' <<< "$RUN")
                fi
                break
              fi
              if test "$SECONDS" -ge "$DEADLINE"; then
                FAILED_WORKFLOWS+=("$WORKFLOW:timeout")
                break
              fi
              sleep 5
            done
          done
          test "${#FAILED_WORKFLOWS[@]}" -eq 0 || {
            printf 'Release required workflows failed: %s\n' \
              "${FAILED_WORKFLOWS[*]}" >&2
            exit 1
          }
          CURRENT_PR=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json headRefName,headRefOid,state)
          test "$(jq -r '.state' <<< "$CURRENT_PR")" = "OPEN"
          test "$(jq -r '.headRefName' <<< "$CURRENT_PR")" = "$HEAD_BRANCH"
          test "$(jq -r '.headRefOid' <<< "$CURRENT_PR")" = "$HEAD_SHA"
          for WORKFLOW in ci.yml dependency-review.yml; do
            case "$WORKFLOW" in
              ci.yml) CHECK_NAME=CI ;;
              dependency-review.yml) CHECK_NAME='Dependency review' ;;
            esac
            RUN_ID=${COMPLETED_RUN_IDS[$WORKFLOW]}
            RUN_URL=${COMPLETED_RUN_URLS[$WORKFLOW]}
            test -n "$RUN_ID"
            test -n "$RUN_URL"
            jq -n --arg name "$CHECK_NAME" --arg sha "$HEAD_SHA" \
              --arg url "$RUN_URL" --arg run_id "$RUN_ID" \
              '{name:$name,head_sha:$sha,status:"completed",conclusion:"success",
                details_url:$url,
                output:{title:("Verified by dispatched workflow run " + $run_id),
                  summary:"The required workflow completed successfully for this exact release head."}}' |
              gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" --input -
          done
      - name: Dispatch release publication
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          jq -n --arg tag "$RELEASE_TAG" \
            '{event_type:"release-created",client_payload:{tag_name:$tag}}' |
            gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" --input -
