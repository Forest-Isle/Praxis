name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release:
    name: Propose or create release
    runs-on: ubuntu-latest
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Run CI and enable automatic merge for release pull request
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          PR_NUMBER=$(jq -r '.number // empty' <<< "$RELEASE_PR")
          HEAD_BRANCH=$(jq -r '.headBranchName // empty' <<< "$RELEASE_PR")
          test -n "$PR_NUMBER"
          test -n "$HEAD_BRANCH"
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_BRANCH"
          PR_DETAILS=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json autoMergeRequest,headRefName,state)
          test "$(jq -r '.headRefName' <<< "$PR_DETAILS")" = "$HEAD_BRANCH"
          AUTO_MERGE=$(jq -r 'if .state != "OPEN" then .state elif .autoMergeRequest == null then "disabled" else "enabled" end' <<< "$PR_DETAILS")
          if test "$AUTO_MERGE" = "disabled"; then
            gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash --delete-branch
          else
            test "$AUTO_MERGE" = "enabled"
          fi
      - name: Dispatch release publication
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          jq -n --arg tag "$RELEASE_TAG" \
            '{event_type:"release-created",client_payload:{tag_name:$tag}}' |
            gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" --input -
